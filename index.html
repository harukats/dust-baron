<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dust Baron</title>
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1a0f0a; overflow: hidden; }
      #game-container { width: 100%; height: 100%; }
      #session-notice { position: absolute; inset: 0; z-index: 10; display: grid; align-content: center; text-align: center; color: #f3e1c0; background: #1a0f0a; font-family: system-ui, sans-serif; padding: 24px; }
      #session-notice[hidden] { display: none; }
      #session-notice h1 { font-size: 24px; margin: 0 0 12px; color: #f2c230; }
      #session-notice p { margin: 0; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <aside id="session-notice" role="status" hidden></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
