# Security updates (enabled in the repo settings) open PRs as soon as an advisory
# lands. The version updates below keep the rest current once a week, grouped so
# each ecosystem is one PR. `dependabot-auto-merge.yml` merges the safe ones.
version: 2
updates:
  - package-ecosystem: npm # also covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    # Wait a few days before taking a fresh release (supply-chain safety).
    # Security updates ignore this.
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
