name: Release

# A `v*` tag builds the Tauri desktop bundles for all three OSes. Once they all
# succeed, it publishes them as a GitHub Release and deploys the web build to
# GitHub Pages; hyphenated pre-release tags skip Pages. The macOS and Windows
# runners are slow, so this stays out of the per-push CI.
#
# Manual runs: with no input, only the desktop bundles are built (uploaded as
# workflow artifacts). With `pages_tag`, the bundles are skipped and only Pages is
# redeployed from that tag's source.
on:
  workflow_dispatch:
    inputs:
      pages_tag:
        description: Redeploy GitHub Pages from this tag (e.g. v0.1.0). Leave empty to build the desktop bundles.
        type: string
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.pages_tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    if: inputs.pages_tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The bundles take their version from package.json, so a mismatched tag would
      # publish e.g. "v0.2.0" with 0.1.0 installers. Fail before the slow build.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # beforeBuildCommand runs `pnpm build` (typecheck + tests + vite build) first.
      # `--locked` goes to cargo: fail rather than silently update a stale Cargo.lock.
      - run: pnpm tauri build ${{ matrix.args }} -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: dust-baron-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*-setup.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          merge-multiple: true
      # Tags with a hyphen (v0.2.0-beta.1) become pre-releases.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          find bundles -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Dust Baron $GITHUB_REF_NAME" "${flags[@]}"

  pages-build:
    # Needs the bundles on a tag push (so the web and desktop versions ship
    # together), but runs alone on a manual `pages_tag` redeploy, where `bundle`
    # is skipped. `!failure()` lets it run past skipped jobs but not failed ones.
    needs: [bundle, release]
    if: >-
      !cancelled() && !failure() && (
        (github.event_name == 'push' && !contains(github.ref_name, '-')) ||
        inputs.pages_tag != ''
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check pages_tag
        if: inputs.pages_tag != ''
        env:
          TAG: ${{ inputs.pages_tag }}
        run: |
          if [[ "$TAG" != v* ]]; then
            echo "::error::pages_tag must be a v* tag, got '$TAG'"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # refs/tags/ makes a branch name or a missing tag fail here.
          ref: ${{ inputs.pages_tag != '' && format('refs/tags/{0}', inputs.pages_tag) || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck + tests + vite build; `base: './'` keeps it working under /dust-baron/
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages-deploy:
    needs: pages-build
    if: ${{ !cancelled() && needs.pages-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
