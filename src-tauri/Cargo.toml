[package]
name = "dust-baron"
version = "0.1.1"
description = "Dust Baron: a post-apocalyptic desert idle miner"
authors = ["harukats"]
license = "MIT"
repository = "https://github.com/harukats/dust-baron"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix keeps the lib from clashing with the bin name on Windows.
name = "dust_baron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
